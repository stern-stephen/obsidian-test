<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kuzu Graph Viewer</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fa;
      --panel: #ffffff;
      --ink: #1f2933;
      --muted: #64748b;
      --line: #d8dee8;
      --semantic: #0f766e;
      --links: #6d5dfc;
      --note: #2563eb;
      --concept: #c2410c;
      --selected: #111827;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(280px, 340px) 1fr minmax(300px, 380px);
      height: 100vh;
      min-width: 0;
    }

    aside {
      min-width: 0;
      overflow: auto;
      padding: 14px;
      background: var(--panel);
      border-right: 1px solid var(--line);
    }

    .details {
      border-left: 1px solid var(--line);
      border-right: 0;
    }

    main {
      position: relative;
      min-width: 0;
      overflow: hidden;
      background: #fbfcfe;
    }

    h1, h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.2;
    }

    h2 {
      margin-top: 18px;
      margin-bottom: 8px;
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .subtle {
      color: var(--muted);
      font-size: 12px;
      margin-top: 4px;
    }

    label {
      display: block;
      margin: 10px 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
    }

    input, select, button {
      font: inherit;
    }

    input[type="search"], input[type="text"], select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px 9px;
      background: #fff;
      color: var(--ink);
    }

    input[type="range"] {
      width: 100%;
    }

    .range-row {
      display: grid;
      grid-template-columns: 1fr 2.5em;
      gap: 10px;
      align-items: center;
    }

    .checks {
      display: grid;
      gap: 8px;
      margin-top: 8px;
    }

    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    button {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      padding: 8px 10px;
    }

    button:hover {
      border-color: #aab4c3;
    }

    .primary {
      border-color: #94a3b8;
      background: #f8fafc;
      font-weight: 650;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .stat {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      background: #fbfcfe;
    }

    .stat strong {
      display: block;
      font-size: 18px;
    }

    .stat span {
      color: var(--muted);
      font-size: 12px;
    }

    .list {
      display: grid;
      gap: 6px;
      margin-top: 8px;
    }

    .item {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: #fff;
      padding: 8px;
    }

    .item.active {
      border-color: var(--selected);
    }

    .item-name {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 650;
    }

    .item-meta {
      color: var(--muted);
      display: block;
      font-size: 12px;
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    svg {
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
    }

    svg.dragging {
      cursor: grabbing;
    }

    .edge {
      stroke: #9aa7b8;
      stroke-opacity: .48;
    }

    .edge.semantic {
      stroke: var(--semantic);
      stroke-opacity: .62;
    }

    .edge.links {
      stroke: var(--links);
      stroke-opacity: .32;
    }

    .node circle {
      stroke: #fff;
      stroke-width: 1.5;
    }

    .node.concept circle {
      fill: var(--concept);
    }

    .node.note circle {
      fill: var(--note);
    }

    .node text {
      fill: #1f2933;
      font-size: 11px;
      pointer-events: none;
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 3px;
      stroke-linejoin: round;
    }

    .node.dimmed, .edge.dimmed {
      opacity: .12;
    }

    .node.selected circle {
      stroke: var(--selected);
      stroke-width: 3;
    }

    .empty {
      color: var(--muted);
      padding: 20px;
    }

    .detail-title {
      font-size: 18px;
      font-weight: 750;
      word-break: break-word;
    }

    .pill {
      display: inline-block;
      border-radius: 999px;
      background: #eef2f7;
      color: #334155;
      font-size: 12px;
      margin: 8px 6px 0 0;
      padding: 3px 8px;
    }

    .edge-card {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px;
      margin-top: 8px;
      background: #fff;
    }

    .edge-card strong {
      display: block;
      margin-bottom: 3px;
    }

    .edge-card p {
      color: var(--muted);
      margin: 6px 0 0;
      font-size: 12px;
    }

    .doc-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .doc-button {
      padding: 5px 7px;
      font-size: 12px;
    }

    .doc-panel {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfe;
      margin-top: 8px;
      overflow: hidden;
    }

    .doc-header {
      border-bottom: 1px solid var(--line);
      color: var(--muted);
      font-size: 12px;
      padding: 8px 10px;
      word-break: break-word;
    }

    .doc-content {
      max-height: 52vh;
      overflow: auto;
      padding: 10px;
    }

    .doc-content h1,
    .doc-content h2,
    .doc-content h3 {
      margin: 14px 0 7px;
      letter-spacing: 0;
      text-transform: none;
      color: var(--ink);
    }

    .doc-content h1 {
      font-size: 18px;
    }

    .doc-content h2 {
      font-size: 15px;
    }

    .doc-content h3 {
      font-size: 14px;
    }

    .doc-content p {
      margin: 8px 0;
    }

    .doc-content a {
      color: #0f5f9c;
      text-decoration: none;
    }

    .doc-content a:hover {
      text-decoration: underline;
    }

    .doc-content pre {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #f1f5f9;
      padding: 8px;
    }

    .doc-content code {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
    }

    @media (max-width: 920px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto 1fr auto;
      }

      aside {
        max-height: 34vh;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .details {
        border-left: 0;
        border-top: 1px solid var(--line);
      }
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"]],
        displayMath: [["$$", "$$"]],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
  <div class="app">
    <aside>
      <h1>Kuzu Graph Viewer</h1>
      <div class="subtle" id="loaded">Loading graph.json</div>

      <label for="search">Search</label>
      <input id="search" type="search" placeholder="Concept, note, relation, evidence">

      <label for="center">Center</label>
      <input id="center" type="text" list="node-options" placeholder="Choose a concept or note">
      <datalist id="node-options"></datalist>

      <label for="relation">Relation</label>
      <select id="relation">
        <option value="">All relations</option>
      </select>

      <label for="layout">Layout</label>
      <select id="layout">
        <option value="radial">Radial mind map</option>
        <option value="force">Force graph</option>
      </select>

      <label for="depth">Depth</label>
      <div class="range-row">
        <input id="depth" type="range" min="0" max="4" step="1" value="2">
        <strong id="depth-value">2</strong>
      </div>

      <div class="checks">
        <label class="check"><input id="semantic" type="checkbox" checked> Semantic edges</label>
        <label class="check"><input id="links" type="checkbox"> Markdown links</label>
        <label class="check"><input id="labels" type="checkbox" checked> Labels</label>
        <label class="check"><input id="docs" type="checkbox" checked> Documentation panel</label>
      </div>

      <div class="toolbar">
        <button id="reset" type="button">Reset</button>
        <button id="fit" type="button">Fit</button>
        <button id="export-svg" type="button" class="primary">SVG</button>
        <button id="export-graphml" type="button" class="primary">GraphML</button>
      </div>

      <div class="stats">
        <div class="stat"><strong id="node-count">0</strong><span>visible nodes</span></div>
        <div class="stat"><strong id="edge-count">0</strong><span>visible edges</span></div>
      </div>

      <h2>Matches</h2>
      <div class="list" id="matches"></div>
    </aside>

    <main>
      <svg id="graph" role="img" aria-label="Interactive graph visualization"></svg>
    </main>

    <aside class="details">
      <div id="details" class="empty">Select a node to inspect its semantic and Markdown relationships.</div>
    </aside>
  </div>

  <script>
    const state = {
      graph: null,
      center: null,
      selected: null,
      visibleNodes: [],
      visibleEdges: [],
      positions: new Map(),
      width: 0,
      height: 0,
      scale: 1,
      tx: 0,
      ty: 0,
      draggingNode: null,
      panning: false,
      lastPointer: null,
      docPath: null,
      docText: "",
      docLoading: false,
      docError: "",
    };

    const svg = document.getElementById("graph");
    const searchInput = document.getElementById("search");
    const centerInput = document.getElementById("center");
    const nodeOptions = document.getElementById("node-options");
    const relationSelect = document.getElementById("relation");
    const semanticInput = document.getElementById("semantic");
    const linksInput = document.getElementById("links");
    const labelsInput = document.getElementById("labels");
    const docsInput = document.getElementById("docs");
    const layoutInput = document.getElementById("layout");
    const depthInput = document.getElementById("depth");
    const depthValue = document.getElementById("depth-value");
    const matchesEl = document.getElementById("matches");
    const detailsEl = document.getElementById("details");

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[char]));
    }

    function displayName(node) {
      return `${node.label} (${node.kind})`;
    }

    function nodeMatches(node, term) {
      if (!term) return true;
      const haystack = `${node.label} ${node.kind} ${node.path || ""}`.toLowerCase();
      return haystack.includes(term);
    }

    function edgeMatches(edge, term) {
      if (!term) return true;
      const haystack = `${edge.relation} ${edge.label} ${edge.evidence_path || ""} ${edge.evidence_summary || ""}`.toLowerCase();
      return haystack.includes(term);
    }

    function nodeByDisplayName(value) {
      return state.graph.nodes.find(node => displayName(node) === value || node.label === value || node.id === value);
    }

    function vaultUrl(path) {
      const encoded = path.split("/").map(part => encodeURIComponent(part)).join("/");
      return new URL(`../../${encoded}`, window.location.href).href;
    }

    function normalizePath(parts) {
      const normalized = [];
      for (const part of parts) {
        if (!part || part === ".") continue;
        if (part === "..") {
          normalized.pop();
        } else {
          normalized.push(part);
        }
      }
      return normalized.join("/");
    }

    function resolveMarkdownPath(basePath, target) {
      const cleanTarget = target.replace(/\\/g, "/");
      const [pathPart, anchor = ""] = cleanTarget.split("#");
      if (!pathPart) return { path: basePath, anchor };
      const decodedPath = decodeURIComponent(pathPart);
      if (/^[A-Za-z]+:\/\//.test(decodedPath)) return { external: decodedPath };
      const baseDir = basePath ? basePath.split("/").slice(0, -1) : [];
      const targetParts = decodedPath.startsWith("/")
        ? decodedPath.slice(1).split("/")
        : [...baseDir, ...decodedPath.split("/")];
      return { path: normalizePath(targetParts), anchor };
    }

    function renderInlineMarkdown(value, basePath) {
      const text = String(value ?? "");
      let output = "";
      let lastIndex = 0;
      const linkPattern = /(!?)\[([^\]]+)\]\(([^)]+)\)/g;
      for (const match of text.matchAll(linkPattern)) {
        output += escapeHtml(text.slice(lastIndex, match.index));
        const isImage = match[1] === "!";
        const label = match[2];
        const target = match[3].trim();
        const resolved = resolveMarkdownPath(basePath, target);
        if (isImage) {
          output += escapeHtml(label);
        } else if (resolved.external) {
          output += `<a href="${escapeHtml(resolved.external)}" target="_blank" rel="noopener noreferrer">${escapeHtml(label)}</a>`;
        } else {
          const href = `${vaultUrl(resolved.path)}${resolved.anchor ? "#" + encodeURIComponent(resolved.anchor) : ""}`;
          output += `<a href="${escapeHtml(href)}" data-doc-path="${escapeHtml(resolved.path)}">${escapeHtml(label)}</a>`;
        }
        lastIndex = match.index + match[0].length;
      }
      output += escapeHtml(text.slice(lastIndex));
      return output;
    }

    function evidencePaths(edges) {
      return [...new Set(edges.map(edge => edge.evidence_path).filter(Boolean))].sort();
    }

    function markdownToHtml(markdown, basePath) {
      const lines = markdown.split(/\r?\n/);
      const html = [];
      let inCode = false;
      let paragraph = [];

      function flushParagraph() {
        if (!paragraph.length) return;
        html.push(`<p>${renderInlineMarkdown(paragraph.join(" "), basePath)}</p>`);
        paragraph = [];
      }

      for (const line of lines) {
        if (line.startsWith("```")) {
          flushParagraph();
          if (inCode) {
            html.push("</code></pre>");
            inCode = false;
          } else {
            html.push("<pre><code>");
            inCode = true;
          }
          continue;
        }
        if (inCode) {
          html.push(`${escapeHtml(line)}\n`);
          continue;
        }
        if (!line.trim()) {
          flushParagraph();
          continue;
        }
        const heading = line.match(/^(#{1,3})\s+(.*)$/);
        if (heading) {
          flushParagraph();
          html.push(`<h${heading[1].length}>${renderInlineMarkdown(heading[2], basePath)}</h${heading[1].length}>`);
          continue;
        }
        if (/^\s*[-*]\s+/.test(line)) {
          flushParagraph();
          html.push(`<p>${renderInlineMarkdown(line, basePath)}</p>`);
          continue;
        }
        paragraph.push(line.trim());
      }
      flushParagraph();
      if (inCode) html.push("</code></pre>");
      return html.join("");
    }

    function typesetDocumentation(attempt = 0) {
      if (window.MathJax?.typesetPromise) {
        window.MathJax.typesetPromise([detailsEl]).catch(error => {
          console.warn("MathJax typeset failed", error);
        });
      } else if (attempt < 20) {
        window.setTimeout(() => typesetDocumentation(attempt + 1), 250);
      }
    }

    function renderDocumentation() {
      if (!docsInput.checked) return "";
      if (!state.docPath) {
        return `<h2>Documentation</h2><div class="subtle">No note or evidence document is associated with this node.</div>`;
      }
      const body = state.docLoading
        ? `<div class="empty">Loading documentation...</div>`
        : state.docError
          ? `<div class="empty">${escapeHtml(state.docError)}</div>`
          : `<div class="doc-content">${markdownToHtml(state.docText, state.docPath)}</div>`;
      return `
        <h2>Documentation</h2>
        <div class="doc-panel">
          <div class="doc-header">${escapeHtml(state.docPath)}</div>
          ${body}
        </div>
      `;
    }

    function loadDocumentation(path) {
      if (!path || state.docPath === path && (state.docLoading || state.docText || state.docError)) return;
      state.docPath = path;
      state.docText = "";
      state.docError = "";
      state.docLoading = true;
      fetch(vaultUrl(path))
        .then(response => {
          if (!response.ok) throw new Error(`Could not load ${path} (${response.status})`);
          return response.text();
        })
        .then(text => {
          if (state.docPath !== path) return;
          state.docText = text;
          state.docLoading = false;
          updateDetails();
        })
        .catch(error => {
          if (state.docPath !== path) return;
          state.docError = error.message;
          state.docLoading = false;
          updateDetails();
        });
    }

    function chooseDocumentationPath(node, edges) {
      if (node.path) return node.path;
      return evidencePaths(edges)[0] || "";
    }

    function filteredEdges() {
      const relation = relationSelect.value;
      const showSemantic = semanticInput.checked;
      const showLinks = linksInput.checked;
      const term = searchInput.value.trim().toLowerCase();
      return state.graph.edges.filter(edge => {
        if (edge.layer === "semantic" && !showSemantic) return false;
        if (edge.layer === "links" && !showLinks) return false;
        if (relation && edge.relation !== relation) return false;
        return edgeMatches(edge, term);
      });
    }

    function computeVisible() {
      const term = searchInput.value.trim().toLowerCase();
      const edges = filteredEdges();
      const byId = new Map(state.graph.nodes.map(node => [node.id, node]));
      const adjacency = new Map();
      for (const edge of edges) {
        if (!adjacency.has(edge.source)) adjacency.set(edge.source, new Set());
        if (!adjacency.has(edge.target)) adjacency.set(edge.target, new Set());
        adjacency.get(edge.source).add(edge.target);
        adjacency.get(edge.target).add(edge.source);
      }

      let nodeIds = new Set();
      const centerId = state.center || state.selected;
      const depth = Number(depthInput.value);

      if (centerId && depth > 0) {
        nodeIds.add(centerId);
        let frontier = new Set([centerId]);
        for (let hop = 0; hop < depth; hop += 1) {
          const next = new Set();
          for (const id of frontier) {
            for (const neighbor of adjacency.get(id) || []) {
              if (!nodeIds.has(neighbor)) {
                nodeIds.add(neighbor);
                next.add(neighbor);
              }
            }
          }
          frontier = next;
        }
        if (term) {
          for (const id of [...nodeIds]) {
            const node = byId.get(id);
            if (!nodeMatches(node, term) && !edges.some(edge => (edge.source === id || edge.target === id) && edgeMatches(edge, term))) {
              nodeIds.delete(id);
            }
          }
        }
      } else {
        for (const edge of edges) {
          nodeIds.add(edge.source);
          nodeIds.add(edge.target);
        }
        if (term) {
          for (const node of state.graph.nodes) {
            if (nodeMatches(node, term)) nodeIds.add(node.id);
          }
        }
      }

      state.visibleNodes = [...nodeIds].map(id => byId.get(id)).filter(Boolean).slice(0, 420);
      const kept = new Set(state.visibleNodes.map(node => node.id));
      state.visibleEdges = edges.filter(edge => kept.has(edge.source) && kept.has(edge.target)).slice(0, 1200);
    }

    function visibleAdjacency() {
      const adjacency = new Map();
      for (const node of state.visibleNodes) adjacency.set(node.id, new Set());
      for (const edge of state.visibleEdges) {
        adjacency.get(edge.source)?.add(edge.target);
        adjacency.get(edge.target)?.add(edge.source);
      }
      return adjacency;
    }

    function radialLayout() {
      const nodes = state.visibleNodes;
      if (!nodes.length) return;
      const centerId = state.center || state.selected || nodes[0].id;
      const adjacency = visibleAdjacency();
      const levels = new Map([[centerId, 0]]);
      let frontier = [centerId];

      while (frontier.length) {
        const next = [];
        for (const id of frontier) {
          for (const neighbor of adjacency.get(id) || []) {
            if (!levels.has(neighbor)) {
              levels.set(neighbor, levels.get(id) + 1);
              next.push(neighbor);
            }
          }
        }
        frontier = next;
      }

      for (const node of nodes) {
        if (!levels.has(node.id)) levels.set(node.id, 1);
      }

      const grouped = new Map();
      for (const node of nodes) {
        const level = levels.get(node.id);
        if (!grouped.has(level)) grouped.set(level, []);
        grouped.get(level).push(node);
      }

      const centerX = state.width / 2;
      const centerY = state.height / 2;
      const maxRing = Math.max(120, Math.min(state.width, state.height) / 2 - 60);
      const maxLevel = Math.max(...grouped.keys(), 1);
      const ringGap = maxRing / maxLevel;

      for (const [level, ringNodes] of grouped) {
        ringNodes.sort((a, b) => a.label.localeCompare(b.label));
        if (level === 0) {
          state.positions.set(ringNodes[0].id, { x: centerX, y: centerY, vx: 0, vy: 0 });
          continue;
        }
        const radius = Math.max(90, ringGap * level);
        ringNodes.forEach((node, index) => {
          const angle = -Math.PI / 2 + (index / Math.max(1, ringNodes.length)) * Math.PI * 2;
          state.positions.set(node.id, {
            x: centerX + Math.cos(angle) * radius,
            y: centerY + Math.sin(angle) * radius,
            vx: 0,
            vy: 0,
          });
        });
      }
    }

    function seedPositions() {
      const radius = Math.max(90, Math.min(state.width, state.height) * 0.34);
      state.visibleNodes.forEach((node, index) => {
        if (state.positions.has(node.id)) return;
        const angle = (index / Math.max(1, state.visibleNodes.length)) * Math.PI * 2;
        state.positions.set(node.id, {
          x: state.width / 2 + Math.cos(angle) * radius,
          y: state.height / 2 + Math.sin(angle) * radius,
          vx: 0,
          vy: 0,
        });
      });
    }

    function simulate(iterations = 70) {
      const nodes = state.visibleNodes;
      const edges = state.visibleEdges;
      const nodeSet = new Set(nodes.map(node => node.id));
      for (const id of [...state.positions.keys()]) {
        if (!nodeSet.has(id)) state.positions.delete(id);
      }
      seedPositions();
      const positions = state.positions;
      const centerX = state.width / 2;
      const centerY = state.height / 2;

      for (let step = 0; step < iterations; step += 1) {
        for (let i = 0; i < nodes.length; i += 1) {
          const a = positions.get(nodes[i].id);
          for (let j = i + 1; j < nodes.length; j += 1) {
            const b = positions.get(nodes[j].id);
            let dx = a.x - b.x;
            let dy = a.y - b.y;
            let dist2 = dx * dx + dy * dy || 1;
            const force = Math.min(80, 1800 / dist2);
            const dist = Math.sqrt(dist2);
            dx /= dist;
            dy /= dist;
            a.vx += dx * force;
            a.vy += dy * force;
            b.vx -= dx * force;
            b.vy -= dy * force;
          }
        }

        for (const edge of edges) {
          const a = positions.get(edge.source);
          const b = positions.get(edge.target);
          if (!a || !b) continue;
          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const target = edge.layer === "semantic" ? 115 : 75;
          const force = (dist - target) * 0.018;
          const fx = (dx / dist) * force;
          const fy = (dy / dist) * force;
          a.vx += fx;
          a.vy += fy;
          b.vx -= fx;
          b.vy -= fy;
        }

        for (const node of nodes) {
          const p = positions.get(node.id);
          p.vx += (centerX - p.x) * 0.004;
          p.vy += (centerY - p.y) * 0.004;
          p.vx *= 0.78;
          p.vy *= 0.78;
          p.x += p.vx;
          p.y += p.vy;
        }
      }
    }

    function render() {
      state.width = svg.clientWidth || 800;
      state.height = svg.clientHeight || 600;
      computeVisible();
      if (layoutInput.value === "radial") {
        radialLayout();
      } else {
        simulate();
      }

      document.getElementById("node-count").textContent = state.visibleNodes.length;
      document.getElementById("edge-count").textContent = state.visibleEdges.length;

      const selectedEdges = new Set();
      if (state.selected) {
        for (const edge of state.visibleEdges) {
          if (edge.source === state.selected || edge.target === state.selected) selectedEdges.add(edge.id);
        }
      }

      const labels = labelsInput.checked;
      const edgeMarkup = state.visibleEdges.map(edge => {
        const source = state.positions.get(edge.source);
        const target = state.positions.get(edge.target);
        const dimmed = state.selected && !selectedEdges.has(edge.id);
        return `<line class="edge ${edge.layer}${dimmed ? " dimmed" : ""}" x1="${source.x}" y1="${source.y}" x2="${target.x}" y2="${target.y}"><title>${escapeHtml(edge.relation)}</title></line>`;
      }).join("");

      const nodeMarkup = state.visibleNodes.map(node => {
        const pos = state.positions.get(node.id);
        const connected = !state.selected || node.id === state.selected || state.visibleEdges.some(edge => selectedEdges.has(edge.id) && (edge.source === node.id || edge.target === node.id));
        const selected = node.id === state.selected;
        const radius = node.kind === "concept" ? 6 : 4.5;
        const text = labels ? `<text x="${radius + 5}" y="4">${escapeHtml(node.label)}</text>` : "";
        return `<g class="node ${node.kind}${selected ? " selected" : ""}${connected ? "" : " dimmed"}" data-id="${escapeHtml(node.id)}" transform="translate(${pos.x},${pos.y})"><circle r="${radius}"></circle>${text}<title>${escapeHtml(node.label)}</title></g>`;
      }).join("");

      svg.innerHTML = `<g transform="translate(${state.tx},${state.ty}) scale(${state.scale})">${edgeMarkup}${nodeMarkup}</g>`;
      svg.querySelectorAll(".node").forEach(el => {
        el.addEventListener("pointerdown", event => {
          event.stopPropagation();
          state.draggingNode = el.dataset.id;
          state.selected = el.dataset.id;
          if (!state.center) {
            state.center = el.dataset.id;
            const centerNode = state.graph.nodes.find(node => node.id === state.center);
            centerInput.value = centerNode ? displayName(centerNode) : "";
          }
          updateDetails();
          renderLists();
          svg.setPointerCapture(event.pointerId);
        });
      });
      renderLists();
      updateDetails();
    }

    function renderLists() {
      const term = searchInput.value.trim().toLowerCase();
      const nodes = state.visibleNodes
        .filter(node => nodeMatches(node, term) || node.id === state.selected)
        .sort((a, b) => a.label.localeCompare(b.label))
        .slice(0, 40);
      matchesEl.innerHTML = nodes.map(node => `
        <button class="item ${node.id === state.selected ? "active" : ""}" data-id="${escapeHtml(node.id)}" type="button">
          <span class="item-name">${escapeHtml(node.label)}</span>
          <span class="item-meta">${escapeHtml(node.kind)}${node.path ? " - " + escapeHtml(node.path) : ""}</span>
        </button>
      `).join("") || `<div class="subtle">No visible matches.</div>`;
      matchesEl.querySelectorAll(".item").forEach(button => {
        button.addEventListener("click", () => {
          state.selected = button.dataset.id;
          state.center = button.dataset.id;
          const centerNode = state.graph.nodes.find(node => node.id === state.center);
          centerInput.value = centerNode ? displayName(centerNode) : "";
          state.positions.clear();
          render();
        });
      });
    }

    function updateDetails() {
      if (!state.selected) {
        detailsEl.className = "empty";
        detailsEl.textContent = "Select a node to inspect its semantic and Markdown relationships.";
        return;
      }
      const node = state.graph.nodes.find(item => item.id === state.selected);
      const edges = state.graph.edges
        .filter(edge => edge.source === state.selected || edge.target === state.selected)
        .sort((a, b) => a.layer.localeCompare(b.layer) || a.relation.localeCompare(b.relation))
        .slice(0, 100);
      if (docsInput.checked) {
        const nextDocPath = chooseDocumentationPath(node, edges);
        if (nextDocPath) {
          loadDocumentation(nextDocPath);
        } else {
          state.docPath = null;
          state.docText = "";
          state.docError = "";
          state.docLoading = false;
        }
      }
      const paths = evidencePaths(edges);
      detailsEl.className = "";
      detailsEl.innerHTML = `
        <div class="detail-title">${escapeHtml(node.label)}</div>
        <span class="pill">${escapeHtml(node.kind)}</span>
        ${node.path ? `<span class="pill">${escapeHtml(node.path)}</span>` : ""}
        ${paths.length ? `
          <h2>Evidence Documents</h2>
          <div class="doc-actions">
            ${paths.slice(0, 16).map(path => `<button class="doc-button" type="button" data-doc-path="${escapeHtml(path)}">${escapeHtml(path.split("/").pop())}</button>`).join("")}
          </div>
        ` : ""}
        ${renderDocumentation()}
        <h2>Relationships</h2>
        ${edges.map(edge => {
          const otherId = edge.source === node.id ? edge.target : edge.source;
          const other = state.graph.nodes.find(item => item.id === otherId);
          const direction = edge.source === node.id ? "->" : "<-";
          const evidence = edge.evidence_path ? `${edge.evidence_path}${edge.evidence_heading ? "#" + edge.evidence_heading : ""}` : "";
          return `
            <div class="edge-card">
              <strong>${escapeHtml(direction)} ${escapeHtml(edge.relation)} ${escapeHtml(other?.label || otherId)}</strong>
              <span class="pill">${escapeHtml(edge.layer)}</span>
              <span class="pill">confidence ${Number(edge.confidence ?? 0).toFixed(2)}</span>
              ${evidence ? `<p>${escapeHtml(evidence)}</p>` : ""}
              ${edge.evidence_summary ? `<p>${escapeHtml(edge.evidence_summary)}</p>` : ""}
            </div>
          `;
        }).join("") || `<div class="subtle">No relationships in the current graph.</div>`}
      `;
      detailsEl.querySelectorAll("[data-doc-path]").forEach(button => {
        button.addEventListener("click", event => {
          event.preventDefault();
          loadDocumentation(button.dataset.docPath);
        });
      });
      typesetDocumentation();
    }

    function fit() {
      state.scale = 1;
      state.tx = 0;
      state.ty = 0;
      render();
    }

    function reset() {
      searchInput.value = "";
      centerInput.value = "";
      relationSelect.value = "";
      semanticInput.checked = true;
      linksInput.checked = false;
      labelsInput.checked = true;
      docsInput.checked = true;
      layoutInput.value = "radial";
      depthInput.value = "2";
      depthValue.textContent = depthInput.value;
      state.center = null;
      state.selected = null;
      state.positions.clear();
      fit();
    }

    function currentGraph() {
      return {
        metadata: {
          ...state.graph.metadata,
          node_count: state.visibleNodes.length,
          edge_count: state.visibleEdges.length,
          semantic_edge_count: state.visibleEdges.filter(edge => edge.layer === "semantic").length,
          markdown_link_count: state.visibleEdges.filter(edge => edge.layer === "links").length,
          relations: [...new Set(state.visibleEdges.map(edge => edge.relation))].sort(),
          exported_from_viewer: true,
        },
        nodes: state.visibleNodes,
        edges: state.visibleEdges,
      };
    }

    function download(filename, content, type) {
      const blob = new Blob([content], { type });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      link.click();
      URL.revokeObjectURL(url);
    }

    function exportSvg() {
      const clone = svg.cloneNode(true);
      clone.setAttribute("xmlns", "http://www.w3.org/2000/svg");
      clone.setAttribute("viewBox", `0 0 ${state.width} ${state.height}`);
      download("visible-graph.svg", `<?xml version="1.0" encoding="UTF-8"?>\n${clone.outerHTML}`, "image/svg+xml");
    }

    function exportGraphml() {
      const graph = currentGraph();
      const nodeIds = new Map(graph.nodes.map((node, index) => [node.id, `n${index}`]));
      const nodeKeys = ["id", "label", "kind", "path"];
      const edgeKeys = ["id", "layer", "relation", "label", "confidence", "evidence_path", "evidence_heading", "evidence_summary", "anchor"];
      const keyXml = [
        ...nodeKeys.map((key, index) => `<key id="n${index}" for="node" attr.name="${key}" attr.type="string"/>`),
        ...edgeKeys.map((key, index) => `<key id="e${index}" for="edge" attr.name="${key}" attr.type="string"/>`),
      ].join("\n  ");
      const nodeXml = graph.nodes.map(node => {
        const data = nodeKeys
          .filter(key => node[key] != null)
          .map((key, index) => `<data key="n${index}">${escapeHtml(node[key])}</data>`)
          .join("");
        return `<node id="${nodeIds.get(node.id)}">${data}</node>`;
      }).join("\n    ");
      const edgeXml = graph.edges.map((edge, index) => {
        const data = edgeKeys
          .filter(key => edge[key] != null)
          .map((key, keyIndex) => `<data key="e${keyIndex}">${escapeHtml(edge[key])}</data>`)
          .join("");
        return `<edge id="edge${index}" source="${nodeIds.get(edge.source)}" target="${nodeIds.get(edge.target)}">${data}</edge>`;
      }).join("\n    ");
      const xml = `<?xml version="1.0" encoding="UTF-8"?>\n<graphml xmlns="http://graphml.graphdrawing.org/xmlns">\n  ${keyXml}\n  <graph id="visible" edgedefault="directed">\n    ${nodeXml}\n    ${edgeXml}\n  </graph>\n</graphml>\n`;
      download("visible-graph.graphml", xml, "application/graphml+xml");
    }

    svg.addEventListener("pointerdown", event => {
      state.panning = true;
      state.lastPointer = { x: event.clientX, y: event.clientY };
      svg.classList.add("dragging");
    });

    svg.addEventListener("pointermove", event => {
      if (state.draggingNode) {
        const pos = state.positions.get(state.draggingNode);
        pos.x = (event.offsetX - state.tx) / state.scale;
        pos.y = (event.offsetY - state.ty) / state.scale;
        pos.vx = 0;
        pos.vy = 0;
        render();
        return;
      }
      if (!state.panning || !state.lastPointer) return;
      state.tx += event.clientX - state.lastPointer.x;
      state.ty += event.clientY - state.lastPointer.y;
      state.lastPointer = { x: event.clientX, y: event.clientY };
      render();
    });

    svg.addEventListener("pointerup", () => {
      state.draggingNode = null;
      state.panning = false;
      state.lastPointer = null;
      svg.classList.remove("dragging");
    });

    svg.addEventListener("wheel", event => {
      event.preventDefault();
      const factor = event.deltaY < 0 ? 1.12 : 0.9;
      state.scale = Math.max(0.25, Math.min(3, state.scale * factor));
      render();
    }, { passive: false });

    centerInput.addEventListener("change", () => {
      const node = nodeByDisplayName(centerInput.value.trim());
      state.center = node?.id || null;
      state.selected = state.center;
      state.positions.clear();
      render();
    });

    depthInput.addEventListener("input", () => {
      depthValue.textContent = depthInput.value;
      state.positions.clear();
      render();
    });

    layoutInput.addEventListener("input", () => {
      state.positions.clear();
      render();
    });

    docsInput.addEventListener("input", () => {
      if (!docsInput.checked) {
        state.docPath = null;
        state.docText = "";
        state.docError = "";
        state.docLoading = false;
      }
      updateDetails();
    });

    for (const el of [searchInput, relationSelect, semanticInput, linksInput, labelsInput]) {
      el.addEventListener("input", render);
    }
    document.getElementById("reset").addEventListener("click", reset);
    document.getElementById("fit").addEventListener("click", fit);
    document.getElementById("export-svg").addEventListener("click", exportSvg);
    document.getElementById("export-graphml").addEventListener("click", exportGraphml);
    window.addEventListener("resize", render);

    fetch("graph.json")
      .then(response => {
        if (!response.ok) throw new Error(`Could not load graph.json (${response.status})`);
        return response.json();
      })
      .then(graph => {
        state.graph = graph;
        document.getElementById("loaded").textContent =
          `${graph.metadata.node_count} nodes - ${graph.metadata.semantic_edge_count} semantic - ${graph.metadata.markdown_link_count} links`;
        for (const relation of graph.metadata.relations) {
          const option = document.createElement("option");
          option.value = relation;
          option.textContent = relation;
          relationSelect.appendChild(option);
        }
        nodeOptions.innerHTML = graph.nodes
          .slice()
          .sort((a, b) => a.label.localeCompare(b.label))
          .map(node => `<option value="${escapeHtml(displayName(node))}"></option>`)
          .join("");
        const metadataCenter = graph.metadata.center_concept ? `concept:${graph.metadata.center_concept}` : null;
        if (metadataCenter && graph.nodes.some(node => node.id === metadataCenter)) {
          state.center = metadataCenter;
          state.selected = metadataCenter;
          const centerNode = graph.nodes.find(node => node.id === metadataCenter);
          centerInput.value = displayName(centerNode);
        }
        render();
      })
      .catch(error => {
        detailsEl.className = "empty";
        detailsEl.textContent = `${error.message}. Run: python scripts\\kuzu_export.py --format viewer-json`;
      });
  </script>
</body>
</html>
