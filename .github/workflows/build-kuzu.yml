name: Build Kuzu database

on:
  workflow_dispatch:
  push:
    branches:
      - codex/rebuild-kuzu-db
    paths:
      - '**/*.md'
      - 'tools/build_kuzu.py'
      - '.github/workflows/build-kuzu.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Kuzu
        run: python -m pip install --upgrade pip kuzu

      - name: Build database
        run: python tools/build_kuzu.py --repo . --output .artifacts/obsidian.kuzu

      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: obsidian-kuzu-db
          path: .artifacts/
          if-no-files-found: error
          retention-days: 30
